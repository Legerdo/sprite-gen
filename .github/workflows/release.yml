# SPDX-License-Identifier: Apache-2.0
name: Release

# A tag without a release page is the failure this exists to prevent: v2.5.3 was tagged,
# changelogged and announced while the release page stayed at v2.5.2, so anyone reading the
# Releases list saw the wrong version as Latest. Pushing `vX.Y.Z` now builds the page from the
# CHANGELOG section for that version; a page that already exists is left exactly as it is.
#
# `workflow_dispatch` is the rehearsal: same script, same decision, `--dry-run`, so the body
# and the asset list can be read before a tag exists. It reads the CHANGELOG of the ref it is
# dispatched on (not of the named tag), because that ref is where the release commit is being
# prepared. The tag push path checks out the tag itself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse, e.g. v2.5.3. Dry run: nothing is tagged, created or uploaded."
        required: true
        type: string

permissions:
  contents: write

# One release per tag at a time. Never cancel: a half-uploaded release is worse than a wait.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the release page for the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter CI tests on; the build backend floor is pinned in pyproject.toml.
          python-version: "3.14"

      - name: Install the build frontend
        run: python -m pip install --upgrade build

      - name: Publish the release page (tag push) or rehearse it (manual dispatch)
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, never interpolated into the shell: a tag name is
          # attacker-controlled text on a fork, and `${{ }}` inside `run:` is substituted
          # before the shell ever sees quoting.
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "rehearsing ${INPUT_TAG} against ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))"
            python scripts/release_publish.py --tag "${INPUT_TAG}" --dry-run
          else
            python scripts/release_publish.py --tag "${GITHUB_REF_NAME}"
          fi
